<!DOCTYPE html>
<html>
  <head>
    <title>Your Cart - BuyBuddy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/pages/cart-header.css">
    <link rel="stylesheet" href="styles/pages/cart.css">
    <link rel="stylesheet" href="styles/shared/extras.css">
  </head>
  <body data-page="cart">
    <div class="checkout-header">
      <div class="header-content">
        <div class="checkout-header-left-section">
          <a href="index.html">
            <img class="site-logo" src="images/logo.svg" alt="BuyBuddy">
            <img class="site-mobile-logo" src="images/mobile-logo.svg" alt="BuyBuddy">
          </a>
        </div>
        <div class="checkout-header-middle-section">
          Cart (<a class="return-to-home-link" href="index.html">0 items</a>)
        </div>
        <div class="checkout-header-right-section">
          <img src="images/icons/checkout-lock-icon.png" alt="">
        </div>
      </div>
    </div>

    <div class="main">
      <div class="page-title">Review your order</div>
      <div class="checkout-grid">
        <div class="order-summary"></div>
        <div class="payment-summary">
          <div class="payment-summary-title">Order Summary</div>
          <div class="payment-summary-rows"></div>
          <button class="place-order-button button-primary">Place your order</button>
        </div>
      </div>
    </div>
    <script src="data/products.js"></script>
    <script src="scripts/store.js"></script>
    <script src="scripts/cart.js"></script>
  </body>
</html>
